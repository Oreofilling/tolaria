name: Windows QA build (#1329)

# Fork-only QA harness (Oreofilling/tolaria): builds an UNSIGNED Windows NSIS
# installer so the #1329 IME fix can be verified with Sogou Pinyin on Windows
# before the commits land on refactoringhq/tolaria. The upstream release
# pipeline stays CircleCI-only. Never push this file upstream.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Configure Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies and prefetch NSIS
        shell: pwsh
        run: |
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          ./.github/scripts/prefetch-tauri-nsis.ps1

      - name: Build Windows bundle (unsigned)
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config .github/qa/tauri-qa-config.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
